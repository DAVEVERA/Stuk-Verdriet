<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wachtwoord herstellen bij Stuk Verdriet</title>
    <style>
      body {
        background: #f2efe9;
        color: #2b312b;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      .preheader {
        display: none;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
      }

      .email-shell {
        background: #f2efe9;
        padding: 28px 14px;
      }

      .email-card {
        background: #fffdf8;
        border: 1px solid rgba(66, 86, 69, 0.18);
        max-width: 640px;
      }

      .email-header {
        background: #425645;
        padding: 26px 28px;
      }

      .email-logo {
        border: 0;
        display: block;
        object-fit: contain;
      }

      .email-title-block {
        padding: 34px 28px 10px;
      }

      .email-kicker {
        color: #6f4f3a;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0 0 12px;
        text-transform: uppercase;
      }

      h1 {
        color: #425645;
        font-size: 34px;
        font-weight: 800;
        line-height: 1.05;
        margin: 0;
      }

      .email-copy-cell {
        padding: 12px 28px 0;
      }

      .email-copy {
        color: #425645;
        font-size: 17px;
        line-height: 1.7;
        margin: 0;
      }

      .email-action-cell {
        padding: 28px;
      }

      .email-button {
        background: #425645;
        color: #fffdf8;
        display: inline-block;
        font-size: 15px;
        font-weight: 800;
        padding: 14px 20px;
        text-decoration: none;
      }

      .email-footer-cell {
        padding: 0 28px 34px;
      }

      .email-footer-text {
        color: #6b7a6a;
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="preheader">Herstel veilig je Stuk Verdriet wachtwoord.</div>
    <table class="email-shell" role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table class="email-card" role="presentation" width="100%" cellspacing="0" cellpadding="0">
            <tr>
              <td class="email-header">
                <img class="email-logo" src="{{ .SiteURL }}/brand/sverdriet_logo.webp" width="72" height="72" alt="Stuk Verdriet">
              </td>
            </tr>
            <tr>
              <td class="email-title-block">
                <p class="email-kicker">Stuk Verdriet account</p>
                <h1>Wachtwoord herstellen</h1>
              </td>
            </tr>
            <tr>
              <td class="email-copy-cell">
                <p class="email-copy">Klik op de knop hieronder om een nieuw wachtwoord in te stellen voor je Stuk Verdriet account.</p>
              </td>
            </tr>
            <tr>
              <td class="email-action-cell">
                <a class="email-button" href="{{ .ConfirmationURL }}">Nieuw wachtwoord instellen</a>
              </td>
            </tr>
            <tr>
              <td class="email-footer-cell">
                <p class="email-footer-text">Heb je dit niet aangevraagd? Negeer deze mail dan.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
