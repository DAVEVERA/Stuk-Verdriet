<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wachtwoord herstellen bij Stuk Verdriet</title>
  </head>
  <body style="margin:0;background:#f2efe9;color:#2b312b;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Herstel veilig je Stuk Verdriet wachtwoord.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2efe9;padding:28px 14px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#fffdf8;border:1px solid rgba(66,86,69,.18);">
            <tr>
              <td style="background:#425645;padding:26px 28px;">
                <img src="{{ .SiteURL }}/brand/sverdriet_logo.webp" width="72" height="72" alt="Stuk Verdriet" style="display:block;border:0;object-fit:contain;">
              </td>
            </tr>
            <tr>
              <td style="padding:34px 28px 10px;">
                <p style="margin:0 0 12px;color:#6f4f3a;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Stuk Verdriet account</p>
                <h1 style="margin:0;color:#425645;font-size:34px;line-height:1.05;font-weight:800;">Wachtwoord herstellen</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 28px 0;">
                <p style="margin:0;color:#425645;font-size:17px;line-height:1.7;">Klik op de knop hieronder om een nieuw wachtwoord in te stellen voor je Stuk Verdriet account.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#425645;color:#fffdf8;font-size:15px;font-weight:800;padding:14px 20px;text-decoration:none;">Nieuw wachtwoord instellen</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 34px;">
                <p style="margin:0;color:#6b7a6a;font-size:14px;line-height:1.6;">Heb je dit niet aangevraagd? Negeer deze mail dan.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
